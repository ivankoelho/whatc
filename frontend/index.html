<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/logo-atacadao.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WhatsApp ATC - Plataforma de Atendimento via WhatsApp">
    <title>WhatsApp ATC</title>
    <script>
      (function() {
        // Light is the default for everyone; only an explicit choice (saved under
        // color-mode:v2, see useColorMode) turns dark on before the app paints.
        var mode = null;
        try { mode = localStorage.getItem('color-mode:v2'); } catch (e) {}
        var isDark = mode === 'dark' || mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
