name: Build develop image

on:
  push:
    branches:
      - main

jobs:
  develop-image:
    # Publishes to this repository owner's GitHub Container Registry only. It is
    # opt-in: set the repository variable PUBLISH_IMAGES=true to enable it, so
    # leaving the fork network never turns image publishing on by accident.
    if: ${{ vars.PUBLISH_IMAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/whatc:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
